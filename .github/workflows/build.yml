name: build

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '23 4 * * *'  # ежедневная проверка новой версии Instagram

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        run: |
          SDKM=/usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager
          yes | $SDKM --licenses > /dev/null || true
          $SDKM "build-tools;36.1.0" "platforms;android-36.1"

      - name: apktool
        run: |
          curl -sL https://github.com/iBotPeaches/Apktool/releases/download/v3.0.3/apktool_3.0.3.jar -o apktool.jar
          echo "APKTOOL=java -jar $PWD/apktool.jar" >> "$GITHUB_ENV"

      - name: Выбор источника базового APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          LATEST=$(curl -s "https://ws75.aptoide.com/api/7/app/get?package_name=com.instagram.android" \
            | python3 -c "import json,sys; d=json.load(sys.stdin); m=d['nodes']['meta']['data']; print(m.get('vername') or m['file']['vername'])")
          CURRENT=$(cat version.txt)
          MODREV=$(cat modrev.txt)
          TAG="${CURRENT}-mod.${MODREV}"
          echo "latest=$LATEST current=$CURRENT tag=$TAG"

          # по расписанию нечего собирать, если релиз этой версии уже есть
          if [ "$(printf '%s\n' "$LATEST" "$CURRENT" | sort -V | tail -1)" = "$LATEST" ] && [ "$LATEST" != "$CURRENT" ]; then
            # Aptoide новее — бампаем версию и собираем с него
            echo "$LATEST" > version.txt
            git config user.name "github-actions"
            git config user.email "github-actions@github.com"
            git add version.txt
            git commit -m "base: bump Instagram to $LATEST"
            git push
          elif [ "${{ github.event_name }}" = "schedule" ] && gh release view "$TAG" > /dev/null 2>&1; then
            echo "schedule: релиз $TAG уже существует — скип"
            echo "skip=1" >> "$GITHUB_ENV"
          elif [ "$LATEST" = "$CURRENT" ]; then
            echo "источник: aptoide"
          elif gh release view "base-$CURRENT" > /dev/null 2>&1; then
            echo "источник: кэш base-$CURRENT (Aptoide отстаёт: $LATEST)"
          else
            echo "skip=1" >> "$GITHUB_ENV"
            echo "::notice::База $CURRENT недоступна: Aptoide=$LATEST, релиза base-$CURRENT нет. Положи чистый APK в релиз base-$CURRENT (см. README)."
          fi

      - name: Сборка
        if: env.skip != '1'
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          if [ -n "${{ secrets.MOD_KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.MOD_KEYSTORE_BASE64 }}" | base64 -d > mod.keystore
          fi
          scripts/build.sh

      - name: Релиз с APK (vars.PUBLISH_APK = true)
        if: env.skip != '1' && vars.PUBLISH_APK == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="$(cat version.txt)-mod.$(cat modrev.txt)"
          APK=$(ls dist/*.apk)
          gh release create "$TAG" "$APK" \
            --title "Insta Mod $TAG" \
            --notes "База: Instagram $(cat version.txt). Патчи: $(ls patches | tr '\n' ' ')" \
            --latest || gh release upload "$TAG" "$APK" --clobber

      - name: Только артефакт (PUBLISH_APK выключен)
        if: env.skip != '1' && vars.PUBLISH_APK != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: insta-mod-apk
          path: dist/*.apk
          retention-days: 14
